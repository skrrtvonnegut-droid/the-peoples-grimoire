[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peoples-grimoire"
version = "0.0.2"
description = "A user-owned, local-first interoperability commons for connected tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The People's Grimoire contributors" }]
keywords = [
  "automation",
  "commons",
  "digital-sovereignty",
  "integration",
  "interoperability",
  "knowledge-management",
  "local-first",
  "saas",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
grimoire = "peoples_grimoire.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
